---
version: '2'

formatters:
  enable:
    - gci

linters:
  default: all
  disable:
    - wsl  # Deprecated
    - varnamelen  # Too strict
    - exhaustruct  # Too strict
    - mnd  # Too strict
    - gomodguard  # Replaced by gomodguard_v2
  exclusions:
    rules:
      - path: tests/e2e
        linters:
          # Shared stacks mutate policy and must remain serial.
          - paralleltest
          - tparallel
          - thelper
          - funlen
          - gocognit
          - cyclop
      # Preserve external JSON field names.
      - path: tests/e2e/internal/harness/(dashboard|load)\.go
        linters:
          - tagliatelle
      - path: tests/e2e/internal/harness/.*_test\.go
        linters:
          - testpackage
      # Ent schema definitions are framework boilerplate (Fields/Edges/Indexes/
      # Annotations); the generated client is auto-excluded but the hand-written
      # schema and codegen entrypoint are not.
      - path: dashboard/store/ent
        linters:
          - revive
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          files:
            - '$all'
          deny:
            - pkg: 'math/rand$'
              desc: 'Use math/rand/v2 instead'
    goconst:
      ignore-tests: true
    gomodguard_v2:
      local-replace-directives: true
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - github.com/google/gopacket.Packet
