---
name: 'g0efilter'

description: >-
  Filter egress traffic from GitHub Actions runners. Non-allowlisted
  connections are blocked, or logged in audit mode, using nftables and
  TLS SNI / HTTP Host inspection. A summary of decisions is added to the
  job summary.

branding:
  icon: shield
  color: green

inputs:
  allowed-domains:
    description: >-
      Newline-separated domains to allow. Supports wildcards
      (*.example.com) and regex patterns (/^cache-[0-9]+\.example\.com$/).
      Required GitHub Actions infrastructure is always allowed so the
      workflow can run.
    required: false
    default: ''

  allowed-ips:
    description: >-
      Newline-separated IPs/CIDRs to allow. The runner's DNS resolvers are
      always allowed.
    required: false
    default: ''

  egress-policy:
    description: >-
      Egress policy to apply. Use `block` to enforce, or `audit` to log
      would-be-blocked traffic without blocking it.
    required: false
    default: 'block'

  mode:
    description: >-
      Filtering mode. Use `https` for TLS SNI / HTTP Host inspection, `dns`
      for resolution filtering, or `dns-strict` to also drop connections to
      IPs never resolved through the proxy (and not IP-allowlisted).
    required: false
    default: 'https'

  log-level:
    description: >-
      g0efilter log level: `TRACE`, `DEBUG`, `INFO`, `WARN`, or `ERROR`.
    required: false
    default: 'INFO'

  lockdown-runner:
    description: >-
      GitHub-hosted runners only. After the filter starts, disable later
      passwordless sudo and restrict the Docker socket so subsequent steps
      cannot remove the hardening, and skip teardown. Unsafe on self-hosted
      runners: leftover nftables rules persist and can break later jobs.
    required: false
    default: 'false'

  notification-urls:
    description: >-
      Whitespace-separated shoutrrr URLs to alert on blocked egress, for
      example `ntfy://ntfy.sh/my-topic` or
      `telegram://BOT_TOKEN@telegram?chats=CHAT_ID`. Pass these from
      `secrets`: each URL is masked in the log and handed to the container
      through the environment, never on the command line. Supports every
      shoutrrr service (gotify, ntfy, telegram, slack, discord, ...).
    required: false
    default: ''

  identity:
    description: >-
      Names this runner in notifications and shipped logs. Defaults to
      `<owner>/<repo>/<workflow>`, which is more useful than the ephemeral
      runner hostname.
    required: false
    default: ''

  notification-ignore:
    description: >-
      Newline-separated rules for blocks that should not alert. Accepts
      domains (`example.com`, `*.example.com`), addresses and CIDRs
      (`10.0.0.0/8`), address classes (`multicast`, `loopback`,
      `link-local`, `private`, `local`), `component:<name>` and `ip-only`.
      Defaults to `local`, which drops the IPv6 neighbour-discovery noise a
      runner always produces.
    required: false
    default: 'local'

  image:
    description: >-
      g0efilter container image to run. Defaults to the image matching the
      action's release tag, for example `uses: g0lab/g0efilter@v0.6.0`
      runs `g0efilter:v0.6.0`. When referenced from a branch, defaults to
      `g0efilter:latest`.
    required: false
    default: ''

runs:
  using: 'node24'
  main: action/main.js
  post: action/post.js
