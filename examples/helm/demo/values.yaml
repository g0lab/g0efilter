---
image: docker.io/alpine/curl:latest

# The allowlist rendered into the policy ConfigMap.
policy:
  ips:
    # Cluster DNS, or nothing resolves under default-deny. 10.96.0.10 is the
    # kubeadm default; k3s and k0s use 10.43.0.10. Check with
    # `kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}'`.
    - 10.96.0.10
  domains:
    - example.com

# Overrides merged over the library chart's defaults.
g0efilter:
  mode: https
  policy:
    configMapName: g0efilter-policy
