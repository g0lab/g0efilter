---
image: docker.io/alpine/curl:latest

# The allowlist rendered into the policy ConfigMap.
policy:
  # Cluster DNS needs no entry: the sidecar allows the pod's own resolver on port 53.
  ips: []
  domains:
    - example.com

# Overrides merged over the library chart's defaults.
g0efilter:
  mode: https
  policy:
    configMapName: g0efilter-policy

  # Optional: alert on blocked egress. --from-file, not --from-literal: the URLs embed
  # a token, and a literal lands in shell history and in ps.
  #   umask 077 && echo 'ntfy://ntfy.sh/my-topic' > urls
  #   kubectl create secret generic g0efilter-notifications --from-file=urls && rm urls
  # notifications:
  #   urlsSecret:
  #     name: g0efilter-notifications
  #     key: urls
  #   ignoreDomains: [local]
