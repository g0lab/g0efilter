# Build g0efilter and the dashboard from source, rather than pulling the
# published images. Settings come from ../.env and ../.env.dashboard.
#
#   docker compose -f examples/build/docker-compose-build.yaml up --build
#
# For the published images and a fuller walkthrough, see the other examples in
# this directory and ../../docs/.
services:
  g0efilter:
    build:
      context: ../..
      dockerfile: examples/build/Containerfile
    image: g0efilter:latest
    container_name: g0efilter
    ports:
      - '127.0.0.1:8081:8081'
    volumes:
      - ./policy/:/app/policy/
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    read_only: true
    env_file:
      - ../.env
    cap_add:
      - NET_ADMIN

  # Gives the dashboard's non-root user ownership of its data volume before it
  # starts. Runs once and exits.
  dashboard-data-init:
    image: alpine:3.24
    command: ['chown', '-R', '65532:65532', '/app/data']
    user: '0:0'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges
    volumes:
      - dashboard-data:/app/data

  g0efilter-dashboard:
    build:
      context: ../..
      dockerfile: examples/build/Containerfile.dashboard
    image: g0efilter-dashboard:latest
    container_name: g0efilter-dashboard
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    read_only: true
    depends_on:
      dashboard-data-init:
        condition: service_completed_successfully
    env_file:
      - ../.env.dashboard
    volumes:
      - dashboard-data:/app/data
    # The dashboard shares the agent's network namespace, so it is reached on the
    # port the agent publishes above.
    network_mode: 'service:g0efilter'

  # The controller talks to a Kubernetes API server, so it cannot run under Compose.
  # It is here so the image can be built from source alongside the others:
  #   docker compose -f examples/build/docker-compose-build.yaml --profile build-only build
  g0efilter-controller:
    profiles: ['build-only']
    build:
      context: ../..
      dockerfile: examples/build/Containerfile.controller
    image: g0efilter-controller:latest

volumes:
  dashboard-data:
