---
# Allow everything except this denylist.
default_action: 'allow'

# Allowlist rules override denylist rules.
allowlist:
  domains:
    - 'api.github.com'               # explicitly allow this host even though *.github.com is denylisted

denylist:
  ips:
    - '192.168.0.0/16'
  domains:
    - '*.github.com'
    - '*.doubleclick.net'
    - '*.google-analytics.com'
    - 'telemetry.example.com'
    - '/update[0-9]*\.example\.com/'
