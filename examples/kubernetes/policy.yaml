---
apiVersion: v1
kind: ConfigMap
metadata:
  name: g0efilter-policy
data:
  # Mounted as a directory so kubelet's ConfigMap refresh triggers g0efilter's
  # live reload; editing this ConfigMap does not need a pod restart.
  policy.yaml: |
    allowlist:
      ips:
        # Cluster DNS. Without it name resolution fails and every request looks
        # blocked - use the ClusterIP of kube-dns in your own cluster.
        - '10.96.0.10'
      domains:
        - 'example.com'
        - '*.githubusercontent.com'
