---
services:
  g0efilter:
    image: docker.io/g0lab/g0efilter:latest
    container_name: g0efilter
    volumes:
      # Mount the directory so live reload keeps working after file replacement.
      - ./policy/:/app/policy/
    cap_drop:
      - ALL
    cap_add:
      # The only capability needed: the image runs as uid 65534 and carries
      # CAP_NET_ADMIN as a file capability.
      - NET_ADMIN
    security_opt:
      - no-new-privileges
    ports:
      - '127.0.0.1:8081:8081'
    read_only: true
    restart: always
    env_file:
      - .env

  g0efilter-dashboard:
    image: docker.io/g0lab/g0efilter-dashboard:latest
    container_name: g0efilter-dashboard
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    read_only: true
    volumes:
      - g0efilter-dashboard-data:/app/data
    env_file:
      - .env.dashboard
    network_mode: 'service:g0efilter'
    restart: always

  example-container:
    image: docker.io/alpine/curl:latest
    command: 'sh -c "sleep infinity"'
    network_mode: 'service:g0efilter'

volumes:
  g0efilter-dashboard-data:
