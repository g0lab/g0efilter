{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "g0efilter-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "g0efilter-controller.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "g0efilter-controller.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Kubelet probes must remain reachable on every supported cluster network.
    - ports:
        - port: {{ .Values.health.port }}
          protocol: TCP
    {{- if .Values.metrics.service.enabled }}
    - ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
    {{- end }}
    {{- if .Values.webhook.enabled }}
    - from:
        {{- range .Values.networkPolicy.apiServerCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: {{ .Values.webhook.port }}
          protocol: TCP
    {{- end }}
{{- end }}
