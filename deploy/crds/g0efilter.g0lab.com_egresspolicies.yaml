---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: egresspolicies.g0efilter.g0lab.com
spec:
  group: g0efilter.g0lab.com
  names:
    categories:
    - g0efilter
    kind: EgressPolicy
    listKind: EgressPolicyList
    plural: egresspolicies
    shortNames:
    - g0ep
    singular: egresspolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.configMapName
      name: ConfigMap
      type: string
    - jsonPath: .status.selectedPods
      name: Pods
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EgressPolicy is a namespaced set of allowed egress destinations. Several may
          coexist in a namespace; each renders its own ConfigMap for pods to mount.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EgressPolicySpec describes the egress a selected set of pods is allowed.

              g0efilter is default-deny: traffic that no rule matches is blocked. This is
              deliberately unlike NetworkPolicy, where an empty rule set on an otherwise
              unselected pod allows everything.
            properties:
              egress:
                description: Egress lists the allowed destinations. An empty list
                  denies all egress.
                items:
                  description: EgressRule allows traffic to a set of peers, optionally
                    narrowed to ports.
                  properties:
                    name:
                      description: Name is an optional label for the rule, used in
                        status and events.
                      maxLength: 63
                      type: string
                    ports:
                      description: |-
                        Ports narrows the rule to specific protocols and ports. When empty, every
                        port is allowed to the listed peers.
                      items:
                        description: EgressPort narrows a rule to a protocol and port.
                        properties:
                          port:
                            description: Port is the destination port.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                          protocol:
                            default: TCP
                            description: Protocol is TCP or UDP.
                            enum:
                            - TCP
                            - UDP
                            type: string
                        required:
                        - port
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    to:
                      description: To lists the destinations this rule allows. At
                        least one is required.
                      items:
                        description: EgressPeer is a set of domain or network destinations.
                        properties:
                          domainNames:
                            description: |-
                              DomainNames matches by HTTP Host or TLS SNI. Supports an exact name, a
                              leading wildcard such as `*.example.com`, or a `/regex/` pattern.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          networks:
                            description: Networks matches by IP or CIDR, for destinations
                              with no usable domain name.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        type: object
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                  required:
                  - to
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              podSelector:
                description: |-
                  PodSelector selects the pods this policy is rendered for. An empty selector
                  matches every pod in the namespace.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              sidecar:
                description: |-
                  Sidecar tunes the container the mutating webhook injects. The Kustomize
                  component and Helm library chart carry their own settings and ignore this.
                properties:
                  connections:
                    description: Connections caps the sidecar's proxied connections.
                    properties:
                      max:
                        description: |-
                          Max is the concurrent connection ceiling per listener. Excess is held with
