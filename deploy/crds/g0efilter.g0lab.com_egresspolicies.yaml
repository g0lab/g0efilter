                        format: int32
                        minimum: 0
                        type: integer
                      maxLifetime:
                        description: |-
                          MaxLifetime is a single absolute deadline on a proxied connection, not an idle
                          timeout: a long-lived stream is cut when it expires. 0 disables it.
                        type: string
                        x-kubernetes-validations:
                        - message: maxLifetime must be 0 or at least 1ms
                          rule: duration(self) == duration('0s') || duration(self)
                            >= duration('1ms')
                    type: object
                  dashboard:
                    description: Dashboard ships this sidecar's logs to a g0efilter
                      dashboard.
                    properties:
                      apiKeySecretRef:
                        description: |-
                          APIKeySecretRef reads the dashboard machine API key from a Secret in the pod's
                          own namespace. The controller never reads the Secret; kubelet resolves it, so a
                          missing key surfaces as the pod failing to start.
                        properties:
                          key:
                            description: The key of the secret to select from.  Must
                              be a valid secret key.
                            type: string
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                          optional:
                            description: Specify whether the Secret or its key must
                              be defined
                            type: boolean
                        required:
                        - key
                        type: object
                        x-kubernetes-map-type: atomic
                      host:
                        description: |-
                          Host is the dashboard's URL, such as
                          `http://g0efilter-dashboard.g0efilter-system.svc:8081`. Shipping is off while
                          this is empty.
                        maxLength: 253
                        type: string
                      queueSize:
                        description: |-
                          QueueSize buffers log entries while shipping. The oldest are dropped when it
                          fills, so the sidecar never blocks the traffic it is filtering.
                        format: int32
                        minimum: 1
                        type: integer
                      remoteUnblock:
                        description: RemoteUnblock polls the dashboard for operator-approved
                          unblock requests.
                        type: boolean
                      startDelay:
                        description: |-
                          StartDelay waits before the first shipment, giving the dashboard time to come
                          up alongside the pod.
                        type: string
                        x-kubernetes-validations:
                        - message: startDelay must not be negative
                          rule: duration(self) >= duration('0s')
                      unblockPollInterval:
                        description: UnblockPollInterval is how often the dashboard
                          is polled for unblock requests.
                        type: string
                        x-kubernetes-validations:
                        - message: unblockPollInterval must be positive
                          rule: duration(self) > duration('0s')
                    type: object
                  dns:
                    description: |-
                      DNS tunes the sidecar's DNS proxy. It only has an effect in `dns` and
                      `dns-strict` mode.
                    properties:
                      hardening:
                        description: |-
                          Hardening applies the anti-exfiltration checks: qname and label length caps,
                          NULL and bulky-TXT answer rejection, and per-source rate limiting. On unless
                          explicitly set to false.
                        type: boolean
                      rateBurst:
                        description: RateBurst is the hardening rate limiter's burst
                          allowance.
                        format: int32
                        minimum: 1
                        type: integer
                      rateQps:
                        description: |-
                          RateQPS is the hardening rate limiter's sustained queries per second. Every
