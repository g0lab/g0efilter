---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: g0efilter-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: g0efilter-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: g0efilter-controller
subjects:
  - kind: ServiceAccount
    name: g0efilter-controller
    namespace: g0efilter-system
---
# Leader election keeps a single replica reconciling, so two replicas cannot render
# conflicting ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: g0efilter-controller-leader-election
rules:
  - apiGroups: ['coordination.k8s.io']
    resources: ['leases']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['']
    resources: ['events']
    verbs: ['create', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: g0efilter-controller-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: g0efilter-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: g0efilter-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: g0efilter-controller
  labels:
    app.kubernetes.io/name: g0efilter-controller
    app.kubernetes.io/component: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: g0efilter-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: g0efilter-controller
    spec:
      serviceAccountName: g0efilter-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # The control plane is not in the data path, so an outage stops policy updates
      # but never stops filtering: the sidecar keeps enforcing its mounted ConfigMap.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: g0efilter-controller
      containers:
        - name: controller
          image: docker.io/g0lab/g0efilter-controller:v0.9.0
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
