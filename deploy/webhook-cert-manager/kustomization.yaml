---
# The webhook with cert-manager issuing and rotating the serving certificate,
# for clusters whose policy requires a managed issuer:
#
#   kubectl apply --server-side -f deploy/crds/
#   kubectl apply -k deploy/webhook-cert-manager
#
# Needs cert-manager with cainjector already installed and ready. Without that
# requirement, deploy/webhook issues its own certificate and needs no dependency.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: g0efilter-system

resources:
  - ../webhook
  - certificate.yaml

patches:
  # External certificate management needs neither Secret access nor permission to
  # update the webhook configuration; cert-manager and cainjector own both.
  - target:
      kind: Role
      name: g0efilter-controller-webhook-certificates
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: g0efilter-controller-webhook-certificates

  - target:
      kind: RoleBinding
      name: g0efilter-controller-webhook-certificates
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: g0efilter-controller-webhook-certificates

  - target:
      kind: ClusterRole
      name: g0efilter-controller-webhook-certificates
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: g0efilter-controller-webhook-certificates

  - target:
      kind: ClusterRoleBinding
      name: g0efilter-controller-webhook-certificates
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: g0efilter-controller-webhook-certificates

  - target:
      kind: Deployment
      name: g0efilter-controller
    path: deployment-patch.yaml

  # cainjector fills the caBundle from the issued Secret.
  - target:
      kind: MutatingWebhookConfiguration
      name: g0efilter-sidecar-injector
    patch: |-
      apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingWebhookConfiguration
      metadata:
        name: g0efilter-sidecar-injector
        annotations:
          cert-manager.io/inject-ca-from: g0efilter-system/g0efilter-webhook
