---
# Optional add-on to the sidecar component: records the first denials as
# Kubernetes Events on the pod, so they appear in `kubectl describe pod`.
#
#   components:
#     - github.com/g0lab/g0efilter//deploy/kustomize/sidecar?ref=v0.9.4
#     - github.com/g0lab/g0efilter//deploy/kustomize/events?ref=v0.9.4
#
# This is opt-in because it is the only thing that gives the pod Kubernetes API
# access. Every container in a pod shares one ServiceAccount, so the permission is
# granted to the workload's ServiceAccount rather than to the sidecar alone.
#
# The RoleBinding below targets the `default` ServiceAccount. If the workload uses
# its own, patch the binding's subject name to match.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - rbac.yaml

patches:
  - target:
      kind: (Deployment|StatefulSet|DaemonSet|ReplicaSet|Job)
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: patched-by-target-selector
      spec:
        template:
          spec:
            automountServiceAccountToken: true
            initContainers:
              - name: g0efilter
                env:
                  - name: KUBE_EVENTS
                    value: 'true'
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: POD_UID
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.uid

  - target:
      kind: CronJob
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: patched-by-target-selector
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                automountServiceAccountToken: true
                initContainers:
                  - name: g0efilter
                    env:
                      - name: KUBE_EVENTS
                        value: 'true'
                      - name: POD_NAME
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.name
                      - name: POD_UID
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.uid
