---
# Creating Events is the only permission g0efilter needs, and only in its own
# namespace. It cannot read or modify anything.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: g0efilter-events
rules:
  - apiGroups: ['']
    resources: ['events']
    verbs: ['create']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: g0efilter-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: g0efilter-events
subjects:
  - kind: ServiceAccount
    name: default
