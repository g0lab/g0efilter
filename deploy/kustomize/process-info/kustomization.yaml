---
# Adds the originating pid and process name to flow logs, so a denial can be traced
# to what made the request:
#
#   components:
#     - github.com/g0lab/g0efilter//deploy/kustomize/sidecar?ref=v0.8.1
#     - github.com/g0lab/g0efilter//deploy/kustomize/process-info?ref=v0.8.1
#
# Reading /proc needs a shared process namespace, and that is mutual: every
# container in the pod can then see and signal the others' processes. Leave this off
# unless the attribution is worth that.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: (Deployment|StatefulSet|DaemonSet|ReplicaSet|Job)
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: patched-by-target-selector
      spec:
        template:
          spec:
            shareProcessNamespace: true
            initContainers:
              - name: g0efilter
                env:
                  - name: PROCESS_INFO
                    value: 'true'

  - target:
      kind: CronJob
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: patched-by-target-selector
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                shareProcessNamespace: true
                initContainers:
                  - name: g0efilter
                    env:
                      - name: PROCESS_INFO
                        value: 'true'
