---
# Optional add-on to the sidecar component: runs the sidecar in learning mode, where
# nothing is blocked and every observed domain and IP is appended to the policy file.
#
#   components:
#     - github.com/g0lab/g0efilter//deploy/kustomize/sidecar?ref=v0.9.6
#     - github.com/g0lab/g0efilter//deploy/kustomize/learning?ref=v0.9.6
#
# Learning mode has to write to the policy file, so the read-only ConfigMap mount is
# replaced with an emptyDir that the sidecar seeds itself. That means the learned
# policy lives only as long as the pod: capture it before the pod goes away with
#
#   kubectl exec <pod> -c g0efilter -- /app/g0efilter policy | kubectl apply -f -
#
# then remove this component so the policy is enforced.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: (Deployment|StatefulSet|DaemonSet|ReplicaSet|Job)
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: patched-by-target-selector
      spec:
        template:
          spec:
            initContainers:
              - name: g0efilter
                env:
                  - name: LEARNING_MODE
                    value: 'true'
                volumeMounts:
                  - name: g0efilter-policy
                    mountPath: /app/policy
                    readOnly: false
            volumes:
              - name: g0efilter-policy
                configMap: null
                emptyDir: {}

  - target:
      kind: CronJob
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: patched-by-target-selector
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                initContainers:
                  - name: g0efilter
                    env:
                      - name: LEARNING_MODE
                        value: 'true'
                    volumeMounts:
                      - name: g0efilter-policy
                        mountPath: /app/policy
                        readOnly: false
                volumes:
                  - name: g0efilter-policy
                    configMap: null
                    emptyDir: {}
