---
name: Fuzz

# Seed corpora run as ordinary Go tests. This workflow also mutates them: pull
# requests get a short smoke run, while nightly runs are longer.
on:
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Duration per fuzz target, e.g. 2m'
        required: false
        default: '2m'

  schedule:
    - cron: '0 4 * * *'

  pull_request:
    branches:
      - main
    paths:
      - 'agent/filter/**'
      - 'agent/policy/**'
      - 'controller/internal/render/**'
      - 'scripts/test-fuzz.sh'
      - '.github/workflows/fuzz.yaml'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Filter egress
        uses: g0lab/g0efilter@a3e2f766b0a74af88a0101a9ad966ed45c688e12 # v0.9.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'
          cache: true
          cache-dependency-path: |
            agent/go.sum
            controller/go.sum
            dashboard/go.sum
            shared/go.sum

      # The corpus Go grows during a run lives in the build cache, so restoring it
      # carries progress between nightly runs instead of restarting from the seeds.
      - name: Restore the fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz
        env:
          FUZZTIME: >-
            ${{ inputs.fuzztime ||
                (github.event_name == 'pull_request' && '20s' || '2m') }}
        run: scripts/test-fuzz.sh

      # Preserve a crash so it can be converted into a named test or inline seed.
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-failures
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 14
