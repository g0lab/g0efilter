---
name: Action Tests

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Action test relevance
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - name: Filter egress
        uses: g0lab/g0efilter@588576788dabd34c91363ded753d3277cc0a4d8c # v0.9.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != 'pull_request' ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE \
            '^(agent|shared|action)/|^action\.yml$|^\.github/(actions|test-actions|scripts)/|^tests/e2e/Containerfile\.agent$|^go\.work$|^scripts/test-action\.sh$|^\.github/workflows/action-test\.yaml$'; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build agent image
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Filter egress
        uses: g0lab/g0efilter@588576788dabd34c91363ded753d3277cc0a4d8c # v0.9.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build agent image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          source: tests/e2e
          files: compose.build.yaml
          targets: g0efilter
          load: true
          set: |
            g0efilter.tags=g0efilter:action-test
            g0efilter.cache-from=type=gha,scope=action-agent
            g0efilter.cache-to=type=gha,scope=action-agent,mode=max

      - name: Save agent image
        run: docker save g0efilter:action-test | gzip -1 > g0efilter-action-test.tar.gz

      - name: Upload agent image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: action-agent-image
          path: g0efilter-action-test.tar.gz
          compression-level: 0
          retention-days: 1

  unit:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Filter egress
        uses: g0lab/g0efilter@588576788dabd34c91363ded753d3277cc0a4d8c # v0.9.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Test
        run: scripts/test-action.sh

  block:
    name: Block policy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: api.github.com

      - name: Allowed HTTPS domain works
        run: .github/scripts/egress-probe.sh reach https://api.github.com

      - name: Non-allowlisted HTTPS domain is blocked
        run: .github/scripts/egress-probe.sh denied https://example.com

      - name: Allowed HTTP host works
        run: .github/scripts/egress-probe.sh reach-http http://api.github.com

      - name: Non-allowlisted HTTP host is blocked
        run: .github/scripts/egress-probe.sh denied-http http://example.com

  post-egress:
    name: Post hook filtering
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: api.github.com

      # Its post hook runs before g0efilter tears down.
      - name: Register later action with a blocked post hook
        uses: ./.github/test-actions/post-egress-check

  domain-patterns:
    name: Domain patterns
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: |
            *.example.com
            /^example\.org$/

      - name: Wildcard matches a subdomain
        run: .github/scripts/egress-probe.sh reach https://www.example.com

      - name: Regex-allowed domain works
        run: .github/scripts/egress-probe.sh reach https://example.org

      - name: Wildcard does not match the apex
        run: .github/scripts/egress-probe.sh denied https://example.com

  dns:
    name: DNS mode
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          mode: dns
          allowed-domains: api.github.com

      - name: Allowed domain resolves and connects
        run: .github/scripts/egress-probe.sh reach https://api.github.com

      - name: Non-allowlisted domain is blocked by dns mode
        run: .github/scripts/egress-probe.sh denied https://example.com

  docker-host-network:
    name: Docker host network
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Pre-pull curl image
        run: .github/scripts/egress-probe.sh pull-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: api.github.com

      - name: Allowed domain works over host network
        run: .github/scripts/egress-probe.sh docker-reach host https://api.github.com

      - name: Non-allowlisted domain is blocked over host network
        run: .github/scripts/egress-probe.sh docker-denied host https://example.com

  docker-bridges:
    name: Docker bridge networks
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Pre-pull curl image
        run: .github/scripts/egress-probe.sh pull-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: api.github.com

      - name: Bridge tables and future-network wildcard are installed
        run: .github/scripts/egress-probe.sh nft-bridge-tables

      - name: Default bridge filters allowed and blocked domains
        run: .github/scripts/egress-probe.sh bridge-check default https://api.github.com https://example.com

      - name: A custom bridge created after startup is also filtered
        run: .github/scripts/egress-probe.sh bridge-check g0efilter-e2e https://api.github.com https://example.com

      - name: Containers on one bridge still reach each other
        run: .github/scripts/egress-probe.sh peer-reach g0efilter-e2e-peers 8080

      # bridge_redirect only touches 80 and 443, so other ports cannot catch a dead exemption.
      - name: Containers on one bridge reach each other on a redirected port
        run: .github/scripts/egress-probe.sh peer-reach g0efilter-e2e-peers80 80

  ipv6:
    name: IPv6
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: api.github.com

      - name: IPv6 filter tables are installed
        run: .github/scripts/egress-probe.sh nft-ipv6-tables

      - name: IPv6 egress to a non-allowlisted domain is blocked
        run: .github/scripts/egress-probe.sh denied https://google.com -6 --max-time 10

  non-web-ports:
    name: Non-web ports
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: api.github.com

      - name: DNS-over-TCP to a non-allowlisted resolver is blocked
        run: .github/scripts/egress-probe.sh tcp-denied 8.8.8.8 53

  fail-closed:
    name: Fail closed
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: api.github.com

      - name: Baseline - non-allowlisted domain is blocked
        run: .github/scripts/egress-probe.sh denied https://example.com

      - name: Kill the filter container
        run: docker rm -f g0efilter

      # Host nftables rules must keep egress closed after the container dies.
      - name: Egress stays closed after the filter dies
        run: .github/scripts/egress-probe.sh denied https://example.com

  dns-strict:
    name: DNS strict mode
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Pre-pull curl image
        run: .github/scripts/egress-probe.sh pull-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          mode: dns-strict
          allowed-domains: api.github.com

      - name: Allowed domain resolves and connects
        run: .github/scripts/egress-probe.sh reach https://api.github.com

      - name: Non-allowlisted domain is blocked
        run: .github/scripts/egress-probe.sh denied https://example.com

      # Unlike dns mode, dns-strict drops unresolved, non-allowlisted IPs.
      - name: Hardcoded IP never resolved is dropped
        run: .github/scripts/egress-probe.sh denied https://1.1.1.1 --max-time 10

      - name: DNS strict resolved sets also protect bridge traffic
        run: |
          .github/scripts/egress-probe.sh docker-reach default https://api.github.com
          .github/scripts/egress-probe.sh docker-denied default https://1.1.1.1 --max-time 10

  lockdown:
    name: Runner lockdown
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          lockdown-runner: 'true'
          allowed-domains: api.github.com

      # Runs under lockdown and before g0efilter's final post hook.
      - name: Assert egress filtered and escalation blocked
        uses: ./.github/test-actions/post-egress-check
        with:
          lockdown: 'true'

  audit:
    name: Audit policy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter (audit)
        uses: ./
        with:
          image: g0efilter:action-test
          egress-policy: audit

      - name: Non-allowlisted domain passes in audit mode
        run: .github/scripts/egress-probe.sh reach https://example.com

  egress-report:
    name: Egress report
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: api.github.com
          notification-ignore: |
            local
            example.com

      - name: Reach the allowed domain
        run: .github/scripts/egress-probe.sh reach https://api.github.com

      - name: Reach the ignored domain, which is still blocked
        run: .github/scripts/egress-probe.sh denied https://example.com

      - name: The report renders real logs and folds the ignored block away
        run: node action/report-check.js

  invalid-input:
    name: Input validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Filter egress
        uses: g0lab/g0efilter@588576788dabd34c91363ded753d3277cc0a4d8c # v0.9.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Invalid mode is rejected
        id: bad-mode
        continue-on-error: true
        uses: ./
        with:
          mode: bogus

      - name: Invalid egress-policy is rejected
        id: bad-policy
        continue-on-error: true
        uses: ./
        with:
          egress-policy: bogus

      - name: Invalid log-level is rejected
        id: bad-level
        continue-on-error: true
        uses: ./
        with:
          log-level: bogus

      - name: Assert the action failed for all
        run: |
          if [ "${{ steps.bad-mode.outcome }}" != "failure" ]; then
            echo "action should have failed for invalid mode"
            exit 1
          fi

          if [ "${{ steps.bad-policy.outcome }}" != "failure" ]; then
            echo "action should have failed for invalid egress-policy"
            exit 1
          fi

          if [ "${{ steps.bad-level.outcome }}" != "failure" ]; then
            echo "action should have failed for invalid log-level"
            exit 1
          fi

          echo "OK: invalid mode, egress-policy, and log-level all rejected"

  # The single required check: skipped counts as a pass, so an irrelevant pull request
  # reports green without running the suite. tests/repo asserts every job feeds in here.
  result:
    name: Action tests
    needs:
      - changes
      - build
      - unit
      - block
      - post-egress
      - domain-patterns
      - dns
      - docker-host-network
      - docker-bridges
      - ipv6
      - non-web-ports
      - fail-closed
      - dns-strict
      - lockdown
      - audit
      - egress-report
      - invalid-input
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Filter egress
        uses: g0lab/g0efilter@588576788dabd34c91363ded753d3277cc0a4d8c # v0.9.3
        with:
          egress-policy: audit

      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
