---
name: Action Tests

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - 'agent/**'
      - 'shared/**'
      - 'action.yml'
      - 'action/**'
      - '.github/actions/**'
      - '.github/test-actions/**'
      - 'tests/e2e/Containerfile.agent'
      - 'go.work'
      - 'agent/go.mod'
      - 'agent/go.sum'
      - 'shared/go.mod'
      - 'shared/go.sum'
      - 'scripts/test-action.sh'
      - '.github/workflows/action-test.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build agent image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build agent image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          source: tests/e2e
          files: compose.build.yaml
          targets: g0efilter
          load: true
          set: |
            g0efilter.tags=g0efilter:action-test
            g0efilter.cache-from=type=gha,scope=action-agent
            g0efilter.cache-to=type=gha,scope=action-agent,mode=max

      - name: Save agent image
        run: docker save g0efilter:action-test | gzip -1 > g0efilter-action-test.tar.gz

      - name: Upload agent image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: action-agent-image
          path: g0efilter-action-test.tar.gz
          compression-level: 0
          retention-days: 1

  unit:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Test
        run: scripts/test-action.sh

  block:
    name: Block policy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: api.github.com

      - name: Allowed HTTPS domain works
        run: >-
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20
          --retry 2 --retry-delay 2 --retry-all-errors
          https://api.github.com -o /dev/null

      - name: Non-allowlisted HTTPS domain is blocked
        run: |
          if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 https://example.com -o /dev/null; then
            echo "example.com should have been blocked"
            exit 1
          fi
          echo "OK: example.com blocked"

      - name: Allowed HTTP host works
        run: >-
          curl --silent --show-error --connect-timeout 10 --max-time 20
          --retry 2 --retry-delay 2 --retry-all-errors
          http://api.github.com -o /dev/null

      - name: Non-allowlisted HTTP host is blocked
        run: |
          if curl --silent --show-error --connect-timeout 10 --max-time 20 http://example.com -o /dev/null; then
            echo "http://example.com should have been blocked"
            exit 1
          fi
          echo "OK: http://example.com blocked"

  post-egress:
    name: Post hook filtering
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: api.github.com

      # Its post hook runs before g0efilter tears down.
      - name: Register later action with a blocked post hook
        uses: ./.github/test-actions/post-egress-check

  domain-patterns:
    name: Domain patterns
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: |
            *.example.com
            /^example\.org$/

      - name: Wildcard matches a subdomain
        run: >-
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20
          --retry 2 --retry-delay 2 --retry-all-errors
          https://www.example.com -o /dev/null

      - name: Regex-allowed domain works
        run: >-
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20
          --retry 2 --retry-delay 2 --retry-all-errors
          https://example.org -o /dev/null

      - name: Wildcard does not match the apex
        run: |
          if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 https://example.com -o /dev/null; then
            echo "example.com apex should not match *.example.com"
            exit 1
          fi
          echo "OK: apex blocked"

  dns:
    name: DNS mode
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          mode: dns
          allowed-domains: api.github.com

      - name: Allowed domain resolves and connects
        run: >-
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20
          --retry 2 --retry-delay 2 --retry-all-errors
          https://api.github.com -o /dev/null

      - name: Non-allowlisted domain is blocked by dns mode
        run: |
          if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 https://example.com -o /dev/null; then
            echo "example.com should have been blocked under dns mode"
            exit 1
          fi
          echo "OK: example.com blocked"

  docker-host-network:
    name: Docker host network
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      # Pull before the filter starts: the registry is not allowlisted.
      - name: Pre-pull curl image
        run: |
          for attempt in 1 2 3; do
            if docker pull curlimages/curl:latest; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: api.github.com

      - name: Allowed domain works over host network
        run: |
          docker run --rm --network host curlimages/curl:latest \
            --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 2 --retry-all-errors \
            https://api.github.com -o /dev/null

      - name: Non-allowlisted domain is blocked over host network
        run: |
          if docker run --rm --network host curlimages/curl:latest \
            --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            https://example.com -o /dev/null; then
            echo "docker --network host bypassed the filter"
            exit 1
          fi
          echo "OK: docker --network host traffic filtered"

  docker-bridges:
    name: Docker bridge networks
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Pre-pull curl image
        run: |
          for attempt in 1 2 3; do
            if docker pull curlimages/curl:latest; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: api.github.com

      - name: Bridge tables and future-network wildcard are installed
        run: |
          sudo nft list table ip g0efilter_bridge_v4 | grep -F 'iifname "docker0" jump bridge_egress'
          sudo nft list table ip g0efilter_bridge_v4 | grep -F 'iifname "br-*" jump bridge_egress'
          sudo nft list table ip g0efilter_bridge_nat_v4 > /dev/null

      - name: Default bridge filters allowed and blocked domains
        run: |
          docker run --rm curlimages/curl:latest \
            --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 2 --retry-all-errors \
            https://api.github.com -o /dev/null
          if docker run --rm curlimages/curl:latest \
            --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            https://example.com -o /dev/null; then
            echo "default Docker bridge bypassed the filter"
            exit 1
          fi

      - name: A custom bridge created after startup is also filtered
        run: |
          docker network create g0efilter-e2e
          trap 'docker network rm g0efilter-e2e >/dev/null 2>&1 || true' EXIT
          docker run --rm --network g0efilter-e2e curlimages/curl:latest \
            --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 2 --retry-all-errors \
            https://api.github.com -o /dev/null
          if docker run --rm --network g0efilter-e2e curlimages/curl:latest \
            --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            https://example.com -o /dev/null; then
            echo "custom Docker bridge bypassed the filter"
            exit 1
          fi

      - name: Containers on one bridge still reach each other
        run: |
          docker network create g0efilter-e2e-peers
          trap 'docker rm -f g0efilter-e2e-peer >/dev/null 2>&1 || true
                docker network rm g0efilter-e2e-peers >/dev/null 2>&1 || true' EXIT
          docker run -d --name g0efilter-e2e-peer --network g0efilter-e2e-peers \
            curlimages/curl:latest nc -l -p 8080
          for attempt in 1 2 3 4 5; do
            peer=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' g0efilter-e2e-peer)
            [ -n "$peer" ] && break
            sleep 1
          done
          if [ -z "$peer" ]; then
            echo "the peer container never reported an address"
            docker logs g0efilter-e2e-peer || true
            exit 1
          fi
          if ! docker run --rm --network g0efilter-e2e-peers curlimages/curl:latest \
            sh -c "echo ping | nc -w 5 $peer 8080"; then
            echo "container to container traffic on one bridge must not be filtered"
            exit 1
          fi

      # bridge_redirect only touches 80 and 443, so other ports cannot catch a dead exemption.
      - name: Containers on one bridge reach each other on a redirected port
        run: |
          docker network create g0efilter-e2e-peers80
          trap 'docker rm -f g0efilter-e2e-peer80 >/dev/null 2>&1 || true
                docker network rm g0efilter-e2e-peers80 >/dev/null 2>&1 || true' EXIT
          docker run -d --name g0efilter-e2e-peer80 --user 0 \
            --network g0efilter-e2e-peers80 curlimages/curl:latest nc -l -p 80
          for attempt in 1 2 3 4 5; do
            peer=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' g0efilter-e2e-peer80)
            [ -n "$peer" ] && break
            sleep 1
          done
          if [ -z "$peer" ]; then
            echo "the peer container never reported an address"
            docker logs g0efilter-e2e-peer80 || true
            exit 1
          fi
          if ! docker run --rm --network g0efilter-e2e-peers80 curlimages/curl:latest \
            sh -c "echo ping | nc -w 5 $peer 80"; then
            echo "same-bridge traffic on port 80 was redirected into the proxy"
            exit 1
          fi

  ipv6:
    name: IPv6
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: api.github.com

      - name: IPv6 filter tables are installed
        run: |
          sudo nft list table ip6 g0efilter_v6 > /dev/null
          sudo nft list table ip6 g0efilter_nat_v6 > /dev/null
          echo "OK: IPv6 filter tables present"

      - name: IPv6 egress to a non-allowlisted domain is blocked
        run: |
          if curl -6 --fail --silent --show-error --connect-timeout 10 --max-time 10 https://google.com -o /dev/null; then
            echo "IPv6 egress should have been blocked"
            exit 1
          fi
          echo "OK: IPv6 egress blocked (or unavailable)"

  non-web-ports:
    name: Non-web ports
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: api.github.com

      # 8.8.8.8:53 is otherwise reachable, so failure confirms filtering.
      - name: DNS-over-TCP to a non-allowlisted resolver is blocked
        run: |
          if timeout 10 bash -c 'cat < /dev/null > /dev/tcp/8.8.8.8/53' 2>/dev/null; then
            echo "TCP/53 to a non-allowlisted resolver should have been blocked"
            exit 1
          fi
          echo "OK: non-web port egress blocked"

  fail-closed:
    name: Fail closed
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          allowed-domains: api.github.com

      - name: Baseline - non-allowlisted domain is blocked
        run: |
          if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 https://example.com -o /dev/null; then
            echo "example.com should have been blocked"
            exit 1
          fi
          echo "OK: example.com blocked while filter is running"

      - name: Kill the filter container
        run: docker rm -f g0efilter

      # Host nftables rules must keep egress closed after the container dies.
      - name: Egress stays closed after the filter dies
        run: |
          if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 https://example.com -o /dev/null; then
            echo "egress opened up after the filter died - not fail-closed"
            exit 1
          fi
          echo "OK: egress remained blocked after filter death"

  dns-strict:
    name: DNS strict mode
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Pre-pull curl image
        run: |
          for attempt in 1 2 3; do
            if docker pull curlimages/curl:latest; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          mode: dns-strict
          allowed-domains: api.github.com

      - name: Allowed domain resolves and connects
        run: >-
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20
          --retry 2 --retry-delay 2 --retry-all-errors
          https://api.github.com -o /dev/null

      - name: Non-allowlisted domain is blocked
        run: |
          if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 https://example.com -o /dev/null; then
            echo "example.com should have been blocked under dns-strict"
            exit 1
          fi
          echo "OK: example.com blocked"

      # Unlike dns mode, dns-strict drops unresolved, non-allowlisted IPs.
      - name: Hardcoded IP never resolved is dropped
        run: |
          if curl --fail --silent --show-error --connect-timeout 10 --max-time 10 https://1.1.1.1 -o /dev/null; then
            echo "connection to unresolved hardcoded IP should have been dropped"
            exit 1
          fi
          echo "OK: unresolved hardcoded IP dropped"

      - name: DNS strict resolved sets also protect bridge traffic
        run: |
          docker run --rm curlimages/curl:latest \
            --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 2 --retry-all-errors \
            https://api.github.com -o /dev/null
          if docker run --rm curlimages/curl:latest \
            --fail --silent --show-error --connect-timeout 10 --max-time 10 \
            https://1.1.1.1 -o /dev/null; then
            echo "unresolved bridge IP bypassed dns-strict"
            exit 1
          fi

  lockdown:
    name: Runner lockdown
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter
        uses: ./
        with:
          image: g0efilter:action-test
          lockdown-runner: 'true'
          allowed-domains: api.github.com

      # Runs under lockdown and before g0efilter's final post hook.
      - name: Assert egress filtered and escalation blocked
        uses: ./.github/test-actions/post-egress-check
        with:
          lockdown: 'true'

  audit:
    name: Audit policy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-agent-image

      - name: Start g0efilter (audit)
        uses: ./
        with:
          image: g0efilter:action-test
          egress-policy: audit

      - name: Non-allowlisted domain passes in audit mode
        run: >-
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20
          --retry 2 --retry-delay 2 --retry-all-errors
          https://example.com -o /dev/null

  invalid-input:
    name: Input validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Invalid mode is rejected
        id: bad-mode
        continue-on-error: true
        uses: ./
        with:
          mode: bogus

      - name: Invalid egress-policy is rejected
        id: bad-policy
        continue-on-error: true
        uses: ./
        with:
          egress-policy: bogus

      - name: Invalid log-level is rejected
        id: bad-level
        continue-on-error: true
        uses: ./
        with:
          log-level: bogus

      - name: Assert the action failed for all
        run: |
          if [ "${{ steps.bad-mode.outcome }}" != "failure" ]; then
            echo "action should have failed for invalid mode"
            exit 1
          fi

          if [ "${{ steps.bad-policy.outcome }}" != "failure" ]; then
            echo "action should have failed for invalid egress-policy"
            exit 1
          fi

          if [ "${{ steps.bad-level.outcome }}" != "failure" ]; then
            echo "action should have failed for invalid log-level"
            exit 1
          fi

          echo "OK: invalid mode, egress-policy, and log-level all rejected"
