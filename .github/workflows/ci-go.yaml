---
name: CI (Go)

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    paths:
      - 'agent/**'
      - 'shared/**'
      - 'dashboard/**'
      - '!dashboard/ui/**'
      - 'dashboard/ui/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'tests/e2e/**/*.go'
      - 'tests/e2e/go.mod'
      - 'tests/e2e/go.sum'
      - 'scripts/test-go.sh'
      - '.github/workflows/ci-go.yaml'

  pull_request:
    paths:
      - 'agent/**'
      - 'shared/**'
      - 'dashboard/**'
      - '!dashboard/ui/**'
      - 'dashboard/ui/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'tests/e2e/**/*.go'
      - 'tests/e2e/go.mod'
      - 'tests/e2e/go.sum'
      - 'scripts/test-go.sh'
      - '.github/workflows/ci-go.yaml'

  workflow_dispatch:

  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: latest

jobs:
  validate-test-lint:
    name: Validate, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # Go tests embed and exercise the built dashboard UI.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: dashboard/ui/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: dashboard/ui/pnpm-lock.yaml

      - name: Build dashboard UI
        run: |
          pnpm --dir dashboard/ui install --frozen-lockfile
          pnpm --dir dashboard/ui build

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: '${{ env.GOLANGCI_LINT_VERSION }}'
          args: >
            --timeout=10m
            ./...

      - name: Lint e2e module
        uses: golangci/golangci-lint-action@v9
        with:
          version: '${{ env.GOLANGCI_LINT_VERSION }}'
          working-directory: tests/e2e
          args: >
            --timeout=10m
            ./...

      - name: Vet e2e module
        working-directory: tests/e2e
        run: go vet ./...

      - name: Test
        run: scripts/test-go.sh

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
