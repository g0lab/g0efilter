---
name: CI (Go)

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    paths:
      - 'agent/**'
      - 'shared/**'
      - 'dashboard/**'
      - '!dashboard/ui/**'
      - 'dashboard/ui/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/test-go.sh'
      - '.github/workflows/ci-go.yaml'

  pull_request:
    paths:
      - 'agent/**'
      - 'shared/**'
      - 'dashboard/**'
      - '!dashboard/ui/**'
      - 'dashboard/ui/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/test-go.sh'
      - '.github/workflows/ci-go.yaml'

  workflow_dispatch: {}

  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: latest

jobs:
  validate-test-lint:
    name: Validate, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # The dashboard UI is embedded at compile time (go:embed all:dist), and
      # server route tests assert on the real UI, so dist/ must be built before
      # `go test` compiles the test binary.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: dashboard/ui/pnpm-lock.yaml

      - name: Build dashboard UI
        run: |
          pnpm --dir dashboard/ui install --frozen-lockfile
          pnpm --dir dashboard/ui build

      - name: Run Go test suite
        run: scripts/test-go.sh

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "${{ env.GOLANGCI_LINT_VERSION }}"
          args: >
            --timeout=10m
            ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
