---
name: CI (Go)

on:
  pull_request:
    paths:
      - 'agent/**'
      - 'shared/**'
      - 'dashboard/**'
      - '!dashboard/ui/**'
      - 'dashboard/ui/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'tests/e2e/**/*.go'
      - 'tests/e2e/go.mod'
      - 'tests/e2e/go.sum'
      - 'tests/manifests/**'
      - 'controller/**'
      - 'deploy/**'
      - 'examples/kubernetes/**'
      - 'examples/helm/**'
      - 'scripts/test-go.sh'
      - '.github/workflows/ci-go.yaml'

  workflow_dispatch:

  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: latest

jobs:
  validate-test-lint:
    name: Validate, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # Go tests embed and exercise the built dashboard UI.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: dashboard/ui/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: dashboard/ui/pnpm-lock.yaml

      - name: Build dashboard UI
        run: |
          pnpm --dir dashboard/ui install --frozen-lockfile
          pnpm --dir dashboard/ui build

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: '${{ env.GOLANGCI_LINT_VERSION }}'
          args: >
            --timeout=10m
            ./...

      - name: Lint e2e module
        uses: golangci/golangci-lint-action@v9
        with:
          version: '${{ env.GOLANGCI_LINT_VERSION }}'
          working-directory: tests/e2e
          args: >
            --timeout=10m
            ./...

      - name: Vet e2e module
        working-directory: tests/e2e
        run: go vet ./...

      - name: Lint controller module
        uses: golangci/golangci-lint-action@v9
        with:
          version: '${{ env.GOLANGCI_LINT_VERSION }}'
          working-directory: controller
          args: >
            --timeout=10m
            ./...

      - name: Generated CRDs are up to date
        run: |
          scripts/gen-controller.sh
          git diff --exit-code -- deploy/crds controller/api deploy/controller \
            deploy/helm/g0efilter-controller/templates

      # Fails when a chart changed without a Chart.yaml version bump.
      - name: Lint charts
        uses: helm/chart-testing-action@v2
        with:
          version: v3.14.0

      - name: Run chart-testing
        run: |
          if ct list-changed --config .github/chart-testing.yaml | grep -q .; then
            ct lint --config .github/chart-testing.yaml
          else
            echo "no chart changes"
          fi

      - name: Test
        run: scripts/test-go.sh

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt,controller/coverage.txt
