---
name: Docker Hub Descriptions

on:
  push:
    paths:
      - 'README.md'
      - '.github/workflows/description.yaml'
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-description:
    environment: dockerhub
    runs-on: ubuntu-latest
    steps:
      - name: Filter egress
        uses: g0lab/g0efilter@f63e1c6bd8f5e2730aa37af077120f17f4f569a3 # v0.10.2
        with:
          egress-policy: block
          allowed-domains: |
            hub.docker.com

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Update agent description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: g0lab/g0efilter
          enable-url-completion: true

      - name: Update dashboard description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: g0lab/g0efilter-dashboard
          enable-url-completion: true

      - name: Update controller description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: g0lab/g0efilter-controller
          enable-url-completion: true
