---
name: Update Major Tag
run-name: Move ${{ inputs.major_version }} to ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'The release tag the major tag should point at (e.g. v0.6.0)'
        required: true
      major_version:
        description: 'The major tag to move (e.g. v0)'
        required: true

concurrency:
  group: major-tag-${{ inputs.major_version }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      MAJOR_VERSION: ${{ inputs.major_version }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate inputs
        run: |
          case "$MAJOR_VERSION" in
            v[0-9]|v[0-9][0-9]) ;;
            *) echo "::error::major_version must look like v0/v1"; exit 1 ;;
          esac
          git rev-parse "$TARGET^{commit}" >/dev/null \
            || { echo "::error::target $TARGET does not exist"; exit 1; }

      - name: Move major tag
        run: |
          git tag -f "$MAJOR_VERSION" "$TARGET"
          git push origin "$MAJOR_VERSION" --force
