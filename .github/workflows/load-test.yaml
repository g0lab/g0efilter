---
name: Load Test

# Scaled-up custom stress run. Normal PR e2e already runs tests/e2e/12_load.sh.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'filter mode'
        type: choice
        options: [https, dns]
        default: https
      total:
        description: 'total blocked connections to fire'
        default: '2000'
      concurrency:
        description: 'concurrent connections per wave'
        default: '100'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    steps:
      - name: Filter egress
        uses: g0lab/g0efilter@797aa833188053c41187319d195dbc865d7cae0a # v0.9.5
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2

      - name: Run load test
        env:
          FILTER_MODE: ${{ inputs.mode }}
          LOAD_TOTAL: ${{ inputs.total }}
          LOAD_CONCURRENCY: ${{ inputs.concurrency }}
        run: scripts/load.sh
