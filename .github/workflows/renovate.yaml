---
name: Renovate

on:
  schedule:
    - cron: '0 9 * * *'

  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        type: choice
        default: info
        options:
          - info
          - debug

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    environment: renovate
    timeout-minutes: 30
    steps:
      - name: Filter egress
        uses: g0lab/g0efilter@797aa833188053c41187319d195dbc865d7cae0a # v0.9.5
        with:
          egress-policy: block
          allowed-domains: |
            ghcr.io
            pkg-containers.githubusercontent.com
            raw.githubusercontent.com
            proxy.golang.org
            sum.golang.org
            registry.npmjs.org
            nodejs.org
            index.docker.io
            registry-1.docker.io
            auth.docker.io
            production.cloudflare.docker.com
            hub.docker.com
            gcr.io
            storage.googleapis.com
            mcr.microsoft.com
            gitlab.com

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create Renovate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Renovate
        uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: .github/renovate.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
