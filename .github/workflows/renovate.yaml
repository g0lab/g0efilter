---
name: Renovate

on:
  schedule:
    - cron: '0 9 * * *'

  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        type: choice
        default: info
        options:
          - info
          - debug

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    environment: renovate
    timeout-minutes: 30
    steps:
      - name: Filter egress
        uses: g0lab/g0efilter@54002a184fb2253b63175c0e592f6b1b477a726d # v0.10.1
        with:
          egress-policy: block
          allowed-domains: |
            ghcr.io
            pkg-containers.githubusercontent.com
            raw.githubusercontent.com
            proxy.golang.org
            sum.golang.org
            registry.npmjs.org
            nodejs.org
            index.docker.io
            registry-1.docker.io
            auth.docker.io
            production.cloudflare.docker.com
            hub.docker.com
            gcr.io
            storage.googleapis.com
            mcr.microsoft.com
            gitlab.com

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create Renovate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: .github/renovate.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
