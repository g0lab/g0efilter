---
name: Tests

on:
  workflow_dispatch:

  schedule:
    - cron: '0 5 * * *'

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GOWORK: 'off'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: E2E relevance
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != 'pull_request' ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE \
            '^(agent|controller|dashboard|deploy|shared|scripts|tests/e2e)/|^examples/(helm|kubernetes)/|^go\.work$|^\.github/workflows/test\.yaml$'; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi

  # Build once for the parallel E2E jobs.
  build:
    name: Build images
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build images
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          # bake resolves the compose file's relative context against the working
          # directory, not the file's own location as docker compose does.
          source: tests/e2e
          files: compose.build.yaml
          load: true
          set: |
            g0efilter.cache-from=type=gha,scope=e2e-agent
            g0efilter.cache-to=type=gha,scope=e2e-agent,mode=max
            g0efilter-dashboard.cache-from=type=gha,scope=e2e-dashboard
            g0efilter-dashboard.cache-to=type=gha,scope=e2e-dashboard,mode=max

      - name: Save images
        run: docker save g0efilter:test g0efilter-dashboard:test | gzip -1 > e2e-images.tar.gz

      - name: Upload images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-images
          path: e2e-images.tar.gz
          compression-level: 0
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.mode }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode:
          - https
          - dns
          - dns-strict

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2

      - name: Download images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-images

      - name: Load images
        run: docker load -i e2e-images.tar.gz

      - name: Set up pnpm
        if: matrix.mode == 'https'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: dashboard/ui/package.json

      - name: Set up Node
        if: matrix.mode == 'https'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/ui/pnpm-lock.yaml

      - name: Install browser dependencies
        if: matrix.mode == 'https'
        working-directory: dashboard/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: tests/e2e/go.sum

      - name: Run e2e (${{ matrix.mode }})
        working-directory: tests/e2e
        env:
          E2E_FILTER_MODE: ${{ matrix.mode }}
          E2E_BROWSER: ${{ matrix.mode == 'https' && '1' || '0' }}
          E2E_BUILD: never
        run: go test -count=1 -v -p 1 -parallel=1 -timeout=35m ./...

      - name: Test demo dashboard
        if: matrix.mode == 'https'
        working-directory: dashboard/ui
        env:
          DASHBOARD_E2E_DEMO: '1'
        run: pnpm test:e2e -- demo.spec.ts

  kubernetes:
    name: E2E (kubernetes)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-images

      - name: Load images
        run: docker load -i e2e-images.tar.gz

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: tests/e2e/go.sum

      # The harness builds the controller image from the checked-out source.
      - name: Run Kubernetes e2e
        working-directory: tests/e2e
        env:
          E2E_K8S: 'true'
          E2E_FILTER_MODE: https
          E2E_BUILD: never
        run: |
          go test -count=1 -v -p 1 -parallel=1 -timeout=35m \
            -run 'TestPhase18Kubernetes|TestPhase19KubernetesWorkload' ./...

  # The single required check: skipped counts as a pass, so an irrelevant pull request
  # reports green without running the suite. tests/repo asserts every job feeds in here.
  result:
    name: E2E
    needs:
      - changes
      - build
      - e2e
      - kubernetes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
