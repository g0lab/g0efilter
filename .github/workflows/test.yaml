---
name: Tests

on:
  workflow_dispatch:

  schedule:
    - cron: '0 5 * * *'

  pull_request:
    branches:
      - main
    paths:
      - 'agent/**'
      - 'dashboard/**'
      - 'shared/**'
      - 'tests/e2e/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test.yaml'

permissions:
  contents: read

jobs:
  # Build once for the parallel E2E jobs.
  build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build images
        uses: docker/bake-action@v7
        with:
          source: .
          files: tests/e2e/compose.build.yaml
          load: true
          set: |
            g0efilter.cache-from=type=gha,scope=e2e-agent
            g0efilter.cache-to=type=gha,scope=e2e-agent,mode=max
            g0efilter-dashboard.cache-from=type=gha,scope=e2e-dashboard
            g0efilter-dashboard.cache-to=type=gha,scope=e2e-dashboard,mode=max

      - name: Save images
        run: docker save g0efilter:test g0efilter-dashboard:test | gzip -1 > e2e-images.tar.gz

      - name: Upload images
        uses: actions/upload-artifact@v7
        with:
          name: e2e-images
          path: e2e-images.tar.gz
          compression-level: 0
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.mode }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode:
          - https
          - dns
          - dns-strict

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Download images
        uses: actions/download-artifact@v8
        with:
          name: e2e-images

      - name: Load images
        run: docker load -i e2e-images.tar.gz

      - name: Set up pnpm
        if: matrix.mode == 'https'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: dashboard/ui/package.json

      - name: Set up Node
        if: matrix.mode == 'https'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/ui/pnpm-lock.yaml

      - name: Install browser dependencies
        if: matrix.mode == 'https'
        working-directory: dashboard/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: tests/e2e/go.sum

      - name: Run e2e (${{ matrix.mode }})
        working-directory: tests/e2e
        env:
          E2E_FILTER_MODE: ${{ matrix.mode }}
          E2E_BROWSER: ${{ matrix.mode == 'https' && '1' || '0' }}
          E2E_BUILD: never
        run: go test -count=1 -v -p 1 -parallel=1 -timeout=35m ./...

      - name: Test demo dashboard
        if: matrix.mode == 'https'
        working-directory: dashboard/ui
        env:
          DASHBOARD_E2E_DEMO: '1'
        run: pnpm test:e2e -- demo.spec.ts
