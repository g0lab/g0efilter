---
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: dockerhub
    timeout-minutes: 30
    env:
      GOEXPERIMENT: jsonv2
      GOWORK: 'off'
    permissions:
      contents: write  # Publish the release.
      id-token: write  # Sign artifacts with Cosign.
      packages: write  # Publish images to GHCR.
    steps:
      - name: Filter egress
        uses: g0lab/g0efilter@588576788dabd34c91363ded753d3277cc0a4d8c # v0.9.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag points to main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tags must point to a commit on main"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: |
            agent/go.sum
            controller/go.sum
            dashboard/go.sum
            shared/go.sum
            tests/go.sum

      - name: Version is consistent
        run: |
          declared="v$(tr -d '[:space:]' < VERSION)"
          if [ "$declared" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::VERSION is $declared but the tag is ${GITHUB_REF_NAME};"\
                 "run scripts/set-version.sh ${GITHUB_REF_NAME} and commit before tagging"
            exit 1
          fi

      - name: Release invariants
        run: go -C tests test -count=1 ./repo/...

      # GoReleaser builds the dashboard UI in its before hook.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: dashboard/ui/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: dashboard/ui/pnpm-lock.yaml

      - name: Build dashboard UI
        run: |
          pnpm --dir dashboard/ui install --frozen-lockfile
          pnpm --dir dashboard/ui build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-chart:
    name: Publish Helm charts
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # Add charts to the product release and update GitHub Pages.
      packages: write  # Publish the OCI chart to GHCR.
    steps:
      - name: Filter egress
        uses: g0lab/g0efilter@588576788dabd34c91363ded753d3277cc0a4d8c # v0.9.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Initialize chart repository
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            exit 0
          fi
          git switch --orphan gh-pages
          git commit --allow-empty -m "Initialize Helm repository"
          git push origin gh-pages
          git switch --detach "$GITHUB_SHA"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm charts
        run: |
          mkdir -p .cr-release-packages
          for chart in deploy/helm/*/Chart.yaml; do
            helm package "$(dirname "$chart")" --destination .cr-release-packages
          done

      - name: Add Helm charts to product release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" .cr-release-packages/*.tgz --clobber

      - name: Update GitHub Pages chart index
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          pages_dir="$RUNNER_TEMP/g0efilter-gh-pages"
          git worktree add "$pages_dir" origin/gh-pages

          index_args=(
            .cr-release-packages
            --url "https://github.com/g0lab/g0efilter/releases/download/${GITHUB_REF_NAME}"
          )
          if [ -f "$pages_dir/index.yaml" ]; then
            index_args+=(--merge "$pages_dir/index.yaml")
          fi
          helm repo index "${index_args[@]}"
          cp .cr-release-packages/index.yaml "$pages_dir/index.yaml"

          git -C "$pages_dir" add index.yaml
          if git -C "$pages_dir" diff --cached --quiet; then
            exit 0
          fi
          git -C "$pages_dir" commit -m "Release ${GITHUB_REF_NAME} Helm charts"
          git -C "$pages_dir" push origin HEAD:gh-pages

      - name: Publish OCI charts
        env:
          G0EFILTER_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$G0EFILTER_GHCR_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          for chart in deploy/helm/*/Chart.yaml; do
            name="$(awk '/^name:/ { print $2; exit }' "$chart")"
            version="$(awk '/^version:/ { print $2; exit }' "$chart")"
            package=".cr-release-packages/${name}-${version}.tgz"
            test -f "$package"
            helm push "$package" oci://ghcr.io/g0lab/helm
          done

  update-major-tag:
    name: Move major version tag
    needs: [release, release-chart]
    runs-on: ubuntu-latest
    environment: release
    # Do not move the rolling tag for prereleases.
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    steps:
      - name: Filter egress
        uses: g0lab/g0efilter@588576788dabd34c91363ded753d3277cc0a4d8c # v0.9.3
        with:
          egress-policy: audit

      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Move major tag
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"
          git tag -f "$MAJOR" "$GITHUB_REF_NAME"
          git push origin "$MAJOR" --force
