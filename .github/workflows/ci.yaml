---
name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/test-go.sh'
      - 'scripts/test-ui.sh'
      - 'go.mod'
      - 'go.sum'

  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/test-go.sh'
      - 'scripts/test-ui.sh'
      - 'go.mod'
      - 'go.sum'

  workflow_dispatch: {}

  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: latest

jobs:
  validate-test-lint:
    name: Validate, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Run Go test suite
        run: scripts/test-go.sh

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "${{ env.GOLANGCI_LINT_VERSION }}"
          args: >
            --timeout=10m
            ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt

  ui:
    name: UI (type-check, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: internal/dashboard/ui/pnpm-lock.yaml

      - name: Run UI test suite
        run: scripts/test-ui.sh
