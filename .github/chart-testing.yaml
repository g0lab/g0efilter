---
# chart-testing (ct) config. check-version-increment is the point: it fails a PR that
# changes a chart without bumping its Chart.yaml version.
remote: origin
target-branch: main
chart-dirs:
  - deploy/helm
check-version-increment: true
validate-maintainers: false

# Both validators need an extra toolchain for little gain: `helm lint` plus
# tests/manifests/ cover Chart.yaml's metadata, and no YAML is linted repo-wide.
validate-chart-schema: false
validate-yaml: false
