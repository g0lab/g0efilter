---
# chart-testing (ct) config: lints the charts a pull request changes.
remote: origin
target-branch: main
chart-dirs:
  - deploy/helm

# No per-PR bump: chart versions track VERSION (tests/repo/version_test.go) and charts
# publish only from a new tag, which tag-release refuses to reuse.
check-version-increment: false
validate-maintainers: false

# Both validators need an extra toolchain for little gain: `helm lint` plus
# tests/manifests/ cover Chart.yaml's metadata, and no YAML is linted repo-wide.
validate-chart-schema: false
validate-yaml: false
