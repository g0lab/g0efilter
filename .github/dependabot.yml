version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    labels: ['dependencies', 'github-actions']
    commit-message:
      prefix: 'chore'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'gomod'
    directories:
      - '/agent'
      - '/dashboard'
      - '/shared'
      - '/tests/e2e'
      - '/tests/repo'
      - '/controller'
    groups:
      gomod:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    schedule:
      interval: 'cron'
      cronjob: '0 9 * * *'
    labels: ['dependencies', 'gomod']
    commit-message:
      prefix: 'chore'

  - package-ecosystem: 'npm'
    directory: '/dashboard/ui'
    schedule:
      interval: 'cron'
      cronjob: '0 9 * * *'
    labels: ['dependencies', 'npm']
    commit-message:
      prefix: 'chore'
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker'
    directories:
      - '/agent'
      - '/dashboard'
      - '/controller'
      - '/examples/build'
      - '/tests/e2e'
    schedule:
      interval: 'cron'
      cronjob: '0 9 * * *'
    labels: ['dependencies', 'docker']
    commit-message:
      prefix: 'chore'
    groups:
      docker:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker-compose'
    directories:
      - '/examples'
      - '/examples/build'
      - '/tests/e2e'
    schedule:
      interval: 'cron'
      cronjob: '0 9 * * *'
    labels: ['dependencies', 'docker']
    commit-message:
      prefix: 'chore'
    groups:
      docker-compose:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels: ['dependencies', 'devcontainer']
    commit-message:
      prefix: 'chore'
